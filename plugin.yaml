name: hermes-ticket-sync
version: "0.1.0"
manifest_version: 2
description: Two-way sync between Hermes kanban cards and issue trackers (Linear, Jira, GitHub, ...).
author: Elijah Boston
license: MIT
provides_tools: []
provides_hooks:
  - on_kanban_dispatch_tick
  - kanban_task_claimed
  - kanban_task_completed
  - kanban_task_blocked
config_schema:
  tracker:
    type: str
    default: ""
    description: Tracker adapter to sync with ("linear", "jira", or "fake"). Sync is off while empty.
  filter:
    type: dict
    default: {}
    description: >-
      Which tracker issues become kanban cards; always include a project, since labels are
      team- or site-wide. Linear keys: label (default "agent"), project (project name), team
      (team key, optional); all ANDed. Jira keys: project and label (default "agent"), or a raw jql.
  api_key_env:
    type: str
    default: LINEAR_API_KEY
    description: "Linear: name of the env var / profile secret holding the Linear API key (sent as-is, no Bearer)."
  base_url_env:
    type: str
    default: JIRA_BASE_URL
    description: "Jira: name of the env var / profile secret holding the site URL, e.g. https://example.atlassian.net."
  email_env:
    type: str
    default: JIRA_EMAIL
    description: "Jira: name of the env var / profile secret holding the Atlassian account email for Basic auth."
  token_env:
    type: str
    default: JIRA_API_TOKEN
    description: "Jira: name of the env var / profile secret holding the Atlassian API token for Basic auth."
  state_map:
    type: dict
    default: {}
    description: Kanban status (ready, running, blocked, review, done) to tracker state name pushed on change.
  assignee:
    type: str
    default: ""
    description: Hermes profile assigned to cards created from tracker issues; empty leaves cards unassigned.
  board:
    type: str
    default: ""
    description: Kanban board slug to sync; empty uses the default board.
  poll_interval_seconds:
    type: int
    default: 60
    description: Minimum seconds between tracker polls on the kanban dispatch tick.
  enabled:
    type: bool
    default: true
    description: Set to false to keep the plugin loaded without syncing.
