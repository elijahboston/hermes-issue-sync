name: hermes-issue-sync
version: "0.1.0"
manifest_version: 2
description: Two-way sync between Hermes kanban cards and Linear or Jira issues, including blocked-card questions answered in the tracker.
requires_hermes: ">=0.21.6"
author: Elijah Boston
license: MIT
provides_tools: []
provides_hooks:
  - on_kanban_dispatch_tick
  - kanban_task_claimed
  - kanban_task_completed
  - kanban_task_blocked
config_schema:
  connections:
    type: list
    default: []
    description: >-
      Several trackers or projects at once. Each entry is a mapping with id (lowercase, unique),
      tracker (linear or jira), projects (list), label, and optionally board, state_map, assignee,
      the *_env credential names, admission keys (admit, max_active, order, leaf_only,
      skip_blocked, exclude_label), prepare_command, and prepare_timeout_seconds; missing keys
      fall back to the top-level settings below.
      When empty, the single-tracker settings (tracker, filter, ...) are used instead.
  tracker:
    type: str
    default: ""
    description: Tracker adapter to sync with ("linear", "jira", or "fake"). Sync is off while empty.
  filter:
    type: dict
    default: {}
    description: >-
      Which tracker issues become kanban cards; always include a project, since labels are
      team- or site-wide. Linear keys: label (default "agent"), project (project name), team
      (team key, optional); all ANDed. Jira keys: project and label (default "agent"), or a raw jql.
  api_key_env:
    type: str
    default: LINEAR_API_KEY
    label: Linear API key env var
    description: "Linear: name of the env var / profile secret holding the Linear API key (sent as-is, no Bearer). Blank uses LINEAR_API_KEY."
  base_url_env:
    type: str
    default: JIRA_BASE_URL
    label: Jira site URL env var
    description: "Jira: name of the env var / profile secret holding the site URL, e.g. https://example.atlassian.net. Blank uses JIRA_BASE_URL."
  email_env:
    type: str
    default: JIRA_EMAIL
    label: Jira email env var
    description: "Jira: name of the env var / profile secret holding the Atlassian account email for Basic auth. Blank uses JIRA_EMAIL."
  token_env:
    type: str
    default: JIRA_API_TOKEN
    label: Jira API token env var
    description: "Jira: name of the env var / profile secret holding the Atlassian API token for Basic auth. Blank uses JIRA_API_TOKEN."
  state_map:
    type: dict
    default: {}
    description: Kanban status (ready, running, blocked, review, done) to tracker state name pushed on change.
  assignee:
    type: str
    default: ""
    description: Hermes profile assigned to cards created from tracker issues; empty leaves cards unassigned.
  board:
    type: str
    default: ""
    label: Default kanban board
    description: >-
      Hermes kanban board that new cards go to. Used by any connection that doesn't set its own
      board; empty uses Hermes's default board.
  poll_interval_seconds:
    type: int
    default: 60
    description: Minimum seconds between tracker polls on the kanban dispatch tick.
  tree_style:
    type: str
    choices: [rounded, lines]
    default: rounded
    label: Panel tree style
    description: >-
      How the Desktop panel draws its tree connectors: "rounded" (curved last branch, lines tinted
      per tracker) or "lines" (plain square lines).
  enabled:
    type: bool
    default: true
    description: Set to false to keep the plugin loaded without syncing.
  admit:
    type: str
    default: label
    description: >-
      Which matching issues become cards. "label" (default) keeps the connection's label filter.
      "all" admits every open issue in the connection's projects (no label needed). "all" with
      no projects is a configuration error and never means the whole workspace.
  max_active:
    type: int
    default: 1
    description: >-
      Cap on this connection's cards in todo, ready, running, review or scheduled (blocked,
      triage, done and archived do not count). Defaults to 1; set 0 for unlimited. Each pass admits
      at most max_active minus currently active cards.
  order:
    type: str
    default: priority
    description: >-
      Sort order for new cards. "priority" (default) sorts Urgent (1) through Low (4), then
      no priority last; ties break by smaller estimate, then oldest created. "created" sorts
      oldest first.
  leaf_only:
    type: bool
    default: false
    description: Skip issues that have any still-open child or sub-issue.
  skip_blocked:
    type: bool
    default: true
    description: Skip issues blocked by another issue that is still open. Defaults to true.
  exclude_label:
    type: str
    default: ""
    description: >-
      Never admit an issue carrying this label (case-insensitive), or whose parent,
      grandparent or great-grandparent carries it. Empty means no extra exclusion.
  prepare_command:
    type: str
    default: ""
    description: >-
      Command run once before each card is created. A string is split with shlex (no shell);
      a list of strings is used as argv. ~ in the first element is expanded. Issue data is
      JSON on stdin, never interpolated into the command. Empty means no hook. Owner-only:
      set in config.yaml; nothing in this plugin writes this setting.
  prepare_timeout_seconds:
    type: int
    default: 120
    description: >-
      Seconds before the prepare command is killed. A timeout counts as a failure; the issue
      is retried on the next pass and does not consume a max_active slot. Default 120.
