[project]
name = "hermes-issue-sync"
version = "0.1.0"
description = "Hermes Agent plugin: two-way sync between Hermes kanban cards and issue trackers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
# The plugin itself has no dependencies (Hermes provides fastapi for dashboard/plugin_api.py);
# these are only for running the test suite.
dev = ["pytest>=8,<10", "fastapi>=0.110,<1"]
